[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "wildintel-uploader"
version = "0.1.0"
description = "WildINTEL Uploader — web and command-line app to import camera-trap deployments into Trapper"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dynaconf>=3.2.12",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "pillow>=11.0",
    "platformdirs>=4.10.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    # The "upload" extra brings what uploading a package to Trapper needs (aiofiles, blake3).
    "wildintel-trapper-sdk[upload]",
    "pyyaml>=6.0",
    "typer>=0.15",
    "uvicorn[standard]>=0.49.0",
    "tzdata>=2024.1",
    "pyepicollect>=5.1.1",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "debugpy>=1.8",
    "mike>=2.0",
    "mkdocs-material>=9.7",
    "playwright>=1.63.0",
    "pyinstaller>=6.21.0",
    "pytest>=8.0",
]

[project.scripts]
# Not "cli": wildintel-trapper-sdk, in the same environment, already has its own.
wildintel-uploader = "wildintel_uploader.cli.app:run"
wucli = "wildintel_uploader.wucli:app"

[tool.uv.sources]
# WildINTEL's own Trapper SDK (module trapper_client). Points at the local
# clone (editable) while it's being developed alongside this app; back to a
# git tag once the changes this app needs are released:
#   wildintel-trapper-sdk = { git = "https://github.com/wildintelproject/wildintelproject-trapper-sdk", tag = "vX.Y.Z" }
wildintel-trapper-sdk = { path = "../wildintel-trapper-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
